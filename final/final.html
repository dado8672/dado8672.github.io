<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Final</title>

    <link rel="stylesheet" href="final-style.css">
    <script src="final-java.js" defer></script>

</head>
<body>
    <div class="battle-container">

        <div class="volume-display">
            <div class="volume-label">
                <span class="enemy-name">The Volume Slider</span>
                <span class="volume-number"><span id="volume-value">100</span> / 100</span>
            </div>
            <div class="volume-bar" id="volume-bar">
                <span class="volume-bar-icon">🔊</span>
                <div class="volume-bar-track">
                    <div class="volume-bar-fill" id="volume-bar-fill"></div>
                    <div class="volume-bar-handle" id="volume-bar-handle"></div>
                </div>
            </div>
        </div>

        <div class="player-display hidden" id="player-display">
            <div class="player-label">
                <span class="player-name">Player</span>
                <span class="player-number"><span id="player-value">100</span> / 100</span>
            </div>
            <div class="player-bar">
                <div class="player-bar-fill" id="player-bar-fill"></div>
            </div>
        </div>

        <div class="dialogue-box" id="dialogue-box">
            Press Enter Battle to fight The Volume Slider.
        </div>

        <div id="out-of-battle">
            <button class="main-btn" onclick="enterBattle()">Enter Battle</button>
        </div>

        <div id="in-battle" class="hidden">
            <div class="main-menu">
                <button class="main-btn" onclick="showAttackMenu()">Attack</button>
                <button class="main-btn" onclick="showHealMenu()">Heal</button>
                <button class="main-btn" onclick="submitVolume()">Submit Volume</button>
            </div>

            <div class="submenu hidden" id="attack-submenu">
                <button class="move-btn" onclick="doSlash()">Slash</button>
                <button class="move-btn" onclick="doFireball()">Fireball</button>
                <button class="move-btn" onclick="doHeavyStrike()">Heavy Strike</button>
                <button class="move-btn" onclick="doJab()">Jab</button>
            </div>

            <div class="submenu hidden" id="heal-submenu">
                <button class="move-btn" onclick="pickHeal('heal')">Heal</button>
                <button class="move-btn" onclick="pickHeal('minor')">Minor Heal</button>
                <button class="move-btn" onclick="pickHeal('pray')">Pray</button>
            </div>

            <div class="submenu hidden" id="target-submenu">
                <button class="move-btn" onclick="doHealOnTarget('self')">Heal Self</button>
                <button class="move-btn" onclick="doHealOnTarget('slider')">Heal The Volume Slider</button>
            </div>
        </div>

    </div>
</body>
</html>
